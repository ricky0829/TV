name: Build Leanback APK

on:
  workflow_dispatch:
  push:
    branches: [fongmi]
    paths:
      - "app/**"
      - ".github/workflows/build-tv.yml"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "buildSrc/**"

permissions:
  contents: write

concurrency:
  group: build-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)
          echo "sdkmanager: $SDKMANAGER"
          echo "--- preinstalled platforms ---"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "build-tools;37.0.0" "platform-tools" || true
          # The runner ships android-37.0/37.1/37.2 but AGP looks for android-37.
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            SRC=$(ls -d "$ANDROID_HOME"/platforms/android-37.* 2>/dev/null | sort | tail -n 1)
            if [ -n "$SRC" ]; then
              echo "linking $SRC -> android-37"
              sudo ln -sfn "$SRC" "$ANDROID_HOME/platforms/android-37"
            fi
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Fetch prebuilt AARs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          if ! gh release download aar --repo "${{ github.repository }}" --pattern '*.aar' --dir app/libs --clobber; then
            echo "::error::Release 'aar' with the prebuilt media3 AARs is missing. Restore that release before building (see the fongmi-tv-upstream-sync skill)."
            exit 1
          fi
          ls -l app/libs

      - name: Prepare signing config
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE" ] && [ -n "$SIGNING_STORE_PASSWORD" ]; then
            printf '%s' "$SIGNING_KEYSTORE" | base64 -d > app/keystore.jks
            STORE_PASSWORD="$SIGNING_STORE_PASSWORD"
            echo "Signing with the persistent key from repository secrets."
          else
            echo "::warning::SIGNING_KEYSTORE is not configured; generating a throwaway key, so this APK cannot upgrade earlier builds."
            keytool -genkeypair -v -keystore app/keystore.jks -alias tv -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=FongMi TV Build, OU=Dev, O=FongMi, L=NA, ST=NA, C=CN"
            STORE_PASSWORD=android
          fi
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          storeFile=keystore.jks
          keyAlias=tv
          storePassword=$STORE_PASSWORD
          keyPassword=$STORE_PASSWORD
          EOF

      - name: Compute version
        id: version
        run: |
          BASE=$(sed -n 's/^tvBaseVersion=//p' gradle.properties | head -1)
          BASE_RE=$(echo "$BASE" | sed 's/\./\\./g')
          NUMS=$(git ls-remote --tags origin "refs/tags/${BASE}-*" \
            | sed -n "s#.*refs/tags/${BASE_RE}-\([0-9][0-9]*\)\$#\1#p" \
            | sort -n)
          LAST=$(echo "$NUMS" | tail -1)
          RECENT=$(echo "$NUMS" | tail -3 | head -1)
          # Tags are zero-padded (01..09). Force base 10: bash treats 08/09 as
          # invalid octal inside arithmetic expansion. Keep the padding so the
          # lexicographic order GitHub uses matches the numeric order.
          NEXT=$(( 10#${LAST:-0} + 1 ))
          VERSION=$(printf "%s-%02d" "$BASE" "$NEXT")
          if [ -n "$LAST" ]; then PREV=$(printf "%s-%02d" "$BASE" "$((10#$LAST))"); else PREV=""; fi
          if [ -n "$RECENT" ]; then RECENT_BASE=$(printf "%s-%02d" "$BASE" "$((10#$RECENT))"); else RECENT_BASE=""; fi
          echo "TV_VERSION_NAME=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"
          echo "recent_base=${RECENT_BASE}" >> "$GITHUB_OUTPUT"
          echo "Base ${BASE}, last tag ${LAST:-none}, recent base ${RECENT_BASE:-none}, building ${VERSION}"

      - name: Build leanback release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleLeanbackRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-leanback-release
          path: app/build/outputs/apk/leanback/release/*.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREV="${{ steps.version.outputs.prev }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BUILT_AT="$(date -u -d '+8 hours' '+%Y-%m-%d %H:%M') 北京时间 (UTC+8)"
          APK_DIR=app/build/outputs/apk/leanback/release

          # Collect the commits shipped since the previous versioned release.
          # Always publish a compare link as a reliable fallback.
          CHANGE_LINES=""
          if [ -n "$PREV" ]; then
            CHANGE_TITLE="**本次变动**（相对 ${PREV}）"
            DIFF_LINE="完整差异：https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_SHA}"
            if gh api "repos/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_SHA}" > /tmp/compare.json 2>/dev/null; then
              CHANGE_LINES=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); cs=d.get("commits",[]); lines=["- %s (%s)" % (c["commit"]["message"].splitlines()[0].strip(), c["sha"][:7]) for c in cs[:20]]; lines += ["- … 其余 %d 条见差异链接" % (len(cs)-20)] if len(cs)>20 else []; print(chr(10).join(lines) or "- （无新增提交）")' /tmp/compare.json)
            fi
          else
            CHANGE_TITLE="**本次变动**（首个版本）"
            DIFF_LINE="提交详情：https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          fi
          if [ -z "$CHANGE_LINES" ]; then CHANGE_LINES="- （提交列表获取失败，请查看下方差异链接）"; fi

          # A per-tag diff is exact but useless when someone upgrades across
          # several versions: the newest release then shows only CI commits and
          # hides the functional fixes shipped one or two releases earlier.
          # Add a cumulative view over the last three published versions,
          # filtering out CI/merge/revert noise so real fixes stay visible.
          RECENT_BASE="${{ steps.version.outputs.recent_base }}"
          RECENT_SECTION=""
          if [ -n "$RECENT_BASE" ]; then
            RECENT_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${RECENT_BASE}...${GITHUB_SHA}"
            RECENT_LINES=""
            if gh api "repos/${GITHUB_REPOSITORY}/compare/${RECENT_BASE}...${GITHUB_SHA}" > /tmp/recent.json 2>/dev/null; then
              RECENT_LINES=$(python3 -c 'import json,sys,re; d=json.load(open(sys.argv[1])); skip=re.compile(r"^(ci|build|chore|docs|merge|revert|test)[(: ]",re.I); all_lines=["- %s (%s)" % (c["commit"]["message"].splitlines()[0].strip(), c["sha"][:7]) for c in d.get("commits",[]) if not skip.match(c["commit"]["message"].splitlines()[0].strip())]; lines=all_lines[:15]; lines += ["- … 其余 %d 条见累计差异链接" % (len(all_lines)-15)] if len(all_lines)>15 else []; print(chr(10).join(lines) or "- （近期无功能类提交）")' /tmp/recent.json)
            fi
            if [ -z "$RECENT_LINES" ]; then RECENT_LINES="- （提交列表获取失败，请查看下方累计差异链接）"; fi
            RECENT_SECTION="**近期功能变更**（自 ${RECENT_BASE} 起，含本版；已过滤 CI / 构建 / 合并类提交）
          $RECENT_LINES

          累计差异：$RECENT_URL"
          fi

          NOTES="Automated leanback build $VERSION from the fongmi branch.

          $CHANGE_TITLE
          $CHANGE_LINES

          $DIFF_LINE

          $RECENT_SECTION

          Commit: $GITHUB_SHA ($SHORT_SHA)
          Built: $BUILT_AT
          APK versionName: $VERSION / versionCode: 587
          Assets: leanback-arm64_v8a.apk / leanback-armeabi_v7a.apk"

          # Versioned release: a fresh tag pointing at this exact commit.
          gh release create "$VERSION" --target "$GITHUB_SHA" \
            --title "FongMi TV $VERSION" --notes "$NOTES"
          gh release upload "$VERSION" "$APK_DIR"/*.apk

          gh release view "$VERSION" --json tagName,assets --jq '.tagName, (.assets[].name)'
