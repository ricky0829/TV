name: Build Leanback APK

on:
  workflow_dispatch:
  push:
    branches: [fongmi]
    paths:
      - "app/**"
      - ".github/workflows/build-tv.yml"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "buildSrc/**"

permissions:
  contents: read

concurrency:
  group: build-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)
          echo "sdkmanager: $SDKMANAGER"
          echo "--- preinstalled platforms ---"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            "$SDKMANAGER" --install --channel=3 "platforms;android-37" "build-tools;37.0.0" "platform-tools" || true
          fi
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            echo "::warning::android-37 is unavailable on this runner, falling back to android-36"
            "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
            sed -i 's/^compileSdk = "37"/compileSdk = "36"/; s/^targetSdk = "37"/targetSdk = "36"/; s/^buildTools = "37.0.0"/buildTools = "36.0.0"/' gradle/libs.versions.toml
          fi
          echo "--- effective versions ---"
          head -n 8 gradle/libs.versions.toml

      - name: Fetch prebuilt AARs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download aar --repo "${{ github.repository }}" --pattern '*.aar' --dir app/libs --clobber
          ls -l app/libs

      - name: Prepare signing config
        run: |
          keytool -genkeypair -v -keystore app/keystore.jks -alias tv -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=FongMi TV Build, OU=Dev, O=FongMi, L=NA, ST=NA, C=CN"
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          storeFile=keystore.jks
          keyAlias=tv
          storePassword=android
          keyPassword=android
          EOF

      - name: Build leanback release
        run: |
          chmod +x gradlew
          # The prebuilt AARs are older than the source tree and still use split
          # FFmpeg libraries, so skip the unified-FFmpeg native guard here.
          ./gradlew --no-daemon assembleLeanbackRelease -x verifyLeanbackReleaseMpvNative

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-leanback-release
          path: app/build/outputs/apk/leanback/release/*.apk
          if-no-files-found: error
