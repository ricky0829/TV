name: Build Leanback APK

on:
  workflow_dispatch:
  push:
    branches: [fongmi]
    paths:
      - "app/**"
      - ".github/workflows/build-tv.yml"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "buildSrc/**"

permissions:
  contents: write

concurrency:
  group: build-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)
          echo "sdkmanager: $SDKMANAGER"
          echo "--- preinstalled platforms ---"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "build-tools;37.0.0" "platform-tools" || true
          # The runner ships android-37.0/37.1/37.2 but AGP looks for android-37.
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            SRC=$(ls -d "$ANDROID_HOME"/platforms/android-37.* 2>/dev/null | sort | tail -n 1)
            if [ -n "$SRC" ]; then
              echo "linking $SRC -> android-37"
              sudo ln -sfn "$SRC" "$ANDROID_HOME/platforms/android-37"
            fi
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Fetch prebuilt AARs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download aar --repo "${{ github.repository }}" --pattern '*.aar' --dir app/libs --clobber
          ls -l app/libs

      - name: Prepare signing config
        run: |
          keytool -genkeypair -v -keystore app/keystore.jks -alias tv -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=FongMi TV Build, OU=Dev, O=FongMi, L=NA, ST=NA, C=CN"
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          storeFile=keystore.jks
          keyAlias=tv
          storePassword=android
          keyPassword=android
          EOF

      - name: Build leanback release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleLeanbackRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-leanback-release
          path: app/build/outputs/apk/leanback/release/*.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=leanback-latest
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Leanback build 5.8.7" \
              --notes "Automated leanback APK build from the fongmi branch ($GITHUB_SHA)."
          fi
          gh release upload "$TAG" app/build/outputs/apk/leanback/release/*.apk --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
